<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Card</title>
    <link rel="icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="background.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Smooch+Sans:wght@100..900&display=swap"
        rel="stylesheet">
    <script src="script.js" defer></script>
    <script src="https://kit.fontawesome.com/2b9c7542e8.js" crossorigin="anonymous"></script>
</head>

<body>

    <div class="cyber-background" aria-hidden="true">
        <div class="ambient-light"></div>
        <div class="perspective-grid"></div>
        <div class="red-horizon"></div>
        <div class="scanlines"></div>
        <div class="noise"></div>
        <section>
            <div class="container">
                <div class="card">
                    <header class="arriba">
                        <h1> Dev Full Stack</h1>
                        <h3>"Memento mori"</h3>
                        <img src="assets/skull-banner.svg" alt="skull banner" id="skull-ban">

                    </header>
                    <main class="informacion">

                        <img src="assets/foto_perfil.webp" alt="Foto de la card" id="profile-pic">

                        <div class="div_ul_flag">
                            <ul class="lista">
                                <li id="nombre"><span class="subtitulos">Name: </span>Leon</li>
                                <li id="ciudad"><span class="subtitulos">City: </span>Bogotá</li>
                                <li id="hobby"><span class="subtitulos">Hobby: </span>Piano</li>
                                <li id="tech_fav"><span class="subtitulos">Technology: </span>Express</li>
                            </ul>
                            <img src="assets/flag-colombia.webp" alt="bandera colombia" id="flagC">
                        </div>
                    </main>
                    <footer class="pie">
                        <span id="correo"><i class="fa-solid fa-inbox"></i>gleoneider@gmail.com</span>
                        <span id="github"><i class="fa-brands fa-github-alt fa-spin-pulse"></i><a
                                href="https://github.com/MrDekro" target="_blank">MrDekro</a></span>
                    </footer>
                </div>
            </div>
        </section>
    </div>


</body>

</html>
